#!/usr/sbin/nft -f
# examples/nftables.conf - OPTIONAL host firewall for the Matrix host (defence in depth).
#
# The edge firewall (e.g. OPNsense) is the primary filter; this only limits what the host
# accepts if something upstream is misconfigured. NOT applied by install.sh.
#
# Adjust the three defines, then:
#   nft -c -f examples/nftables.conf            # syntax check only
#   cp examples/nftables.conf /etc/nftables.conf && systemctl enable --now nftables
# Keep a console (Proxmox: pct enter <vmid>) open while testing so a mistake can't lock you out.
#
# Ports: docs/ARCHITECTURE.md -> Ports, docs/INSTALL.md §2.

define LAN        = 192.168.1.0/24     # SSH and direct (admin) HTTPS from the LAN
define EDGE_PROXY = 192.168.1.1        # reverse proxy forwarding HTTPS here
define RELAY_RANGE = 49152-50000      # coturn min-port-max-port (/etc/turnserver.conf)

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP / ICMPv6 (path MTU discovery, neighbour discovery, ping)
        meta l4proto { icmp, ipv6-icmp } accept

        # SSH from the LAN only
        ip saddr $LAN tcp dport 22 accept

        # HTTP(S) to nginx: the edge proxy, plus LAN clients (Synapse-Admin, Maubot UI)
        ip saddr { $EDGE_PROXY, $LAN } tcp dport { 80, 443 } accept

        # coturn: STUN/TURN, TURN over TLS/DTLS, relay range (port-forwarded from the internet)
        udp dport { 3478, 5349 } accept
        tcp dport { 3478, 5349 } accept
        udp dport $RELAY_RANGE accept

        # LiveKit media: ICE/TCP 7881, UDP mux 7882 (port-forwarded from the internet).
        # Signalling (7880) is reached only through nginx on localhost, so it is not opened.
        tcp dport 7881 accept
        udp dport 7882 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
